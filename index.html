<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draftbox: free AI writer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#eef0f7;--ink:#1b1f4b;--soft:#5b6086;--card:#fff;--line:#d5d9ea;--accent:#f2b632}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif}
  main{max-width:680px;margin:0 auto;padding:48px 20px 64px}
  h1{font:600 clamp(2.4rem,7vw,3.6rem)/1.05 Newsreader,Georgia,serif;margin:0 0 12px;letter-spacing:-.02em}
  .sub{color:var(--soft);margin:0 0 32px;max-width:46ch}
  label{display:block;font-weight:500;margin:0 0 6px}
  textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px}
  textarea{min-height:130px;resize:vertical}
  textarea:focus,select:focus,button:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
  .row{display:flex;gap:12px;margin:16px 0 20px;flex-wrap:wrap}
  .row>div{flex:1 1 180px}
  button{font:500 1rem Inter,sans-serif;border:0;border-radius:10px;padding:12px 22px;cursor:pointer}
  #go{background:var(--ink);color:#fff;width:100%;padding:15px}
  #go:disabled{opacity:.6;cursor:wait}
  #go:hover:not(:disabled){background:#2c3270}
  #out{margin-top:28px;display:none}
  #text{background:var(--card);border-left:6px solid var(--accent);border-radius:4px 10px 10px 4px;padding:20px 22px;font:400 1.1rem/1.65 Newsreader,Georgia,serif;white-space:pre-wrap;min-height:60px}
  #text.err{border-left-color:#c0392b;font:400 1rem Inter,sans-serif;color:#8a2a1f}
  #copy{margin-top:10px;background:transparent;border:1.5px solid var(--line);color:var(--ink);padding:8px 16px}
  small{display:block;margin-top:6px;color:var(--soft);text-align:right}
</style>
</head>
<body>
<main>
  <h1>Draftbox</h1>
  <p class="sub">Describe what you need and get a first draft in seconds.</p>

  <label for="prompt">What should it write?</label>
  <textarea id="prompt" maxlength="1000" placeholder="A short thank-you note to my neighbor for watering my plants"></textarea>
  <small><span id="n">0</span>/1000</small>

  <div class="row">
    <div>
      <label for="tone">Tone</label>
      <select id="tone"><option>Friendly</option><option>Professional</option><option>Funny</option><option>Poetic</option><option>Direct</option></select>
    </div>
    <div>
      <label for="len">Length</label>
      <select id="len"><option>Short</option><option selected>Medium</option><option>Long</option></select>
    </div>
  </div>

  <button id="go">Generate draft</button>

  <section id="out" aria-live="polite">
    <div id="text"></div>
    <button id="copy">Copy text</button>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
$('prompt').addEventListener('input', e => $('n').textContent = e.target.value.length);

$('go').addEventListener('click', async () => {
  const prompt = $('prompt').value.trim();
  if (!prompt) { show('Type what you want written first.', true); return; }
  $('go').disabled = true; $('go').textContent = 'Generating…';
  try {
    const r = await fetch('/api/generate', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({prompt, tone: $('tone').value, length: $('len').value})
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Request failed.');
    show(d.text, false);
  } catch (e) {
    show(e.message + ' Wait a moment and try again.', true);
  } finally {
    $('go').disabled = false; $('go').textContent = 'Generate draft';
  }
});

$('copy').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText($('text').textContent); $('copy').textContent = 'Copied'; }
  catch { $('copy').textContent = 'Select the text to copy'; }
  setTimeout(() => $('copy').textContent = 'Copy text', 1500);
});

function show(msg, isErr) {
  $('out').style.display = 'block';
  $('text').className = isErr ? 'err' : '';
  $('text').textContent = msg;
  $('copy').style.display = isErr ? 'none' : 'inline-block';
}
</script>
</body>
</html>
